name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon test assembleDebug assembleRelease

      - name: Name the APKs after the tag
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "pop-dictionary-${TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "pop-dictionary-${TAG}-release-unsigned.apk"
          cp app/build/outputs/apk/debug/app-debug.apk pop-dictionary-debug.apk
          # Stable filenames too, so /releases/latest/download/pop-dictionary-debug.apk
          # keeps working as versions change. The colordict-* names are kept so
          # links shared before the rename still work.
          cp app/build/outputs/apk/debug/app-debug.apk colordict-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             colordict-release-unsigned.apk

      - name: Publish GitHub release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: docs/releases/<tag>.md when present, else a short default.
          NOTES="docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$(mktemp)"
            echo "Ready-to-install **debug APK** (install this one directly on your device) and an unsigned release APK (sign it with your own key before distributing)." > "$NOTES"
          fi
          gh release create "${TAG}" \
            "pop-dictionary-${TAG}-debug.apk" \
            "pop-dictionary-${TAG}-release-unsigned.apk" \
            "pop-dictionary-debug.apk" \
            "colordict-debug.apk" \
            "colordict-release-unsigned.apk" \
            --target "${GITHUB_SHA}" \
            --title "Pop Dictionary ${TAG}" \
            --notes-file "$NOTES" \
            --repo "${GITHUB_REPOSITORY}"
